[package]
name = "akkhara-installer"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "GUI installer for the Akkhara programming language (akk)"

[dependencies]
eframe = "0.29"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
