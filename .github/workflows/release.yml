# For the Akkhara-Installer repo. Push a tag like v0.1.0 to publish installers.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,  suffix: windows-x86_64.exe, ext: .exe }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, suffix: linux-x86_64,       ext: '' }
          - { os: macos-latest,   target: aarch64-apple-darwin,     suffix: macos-aarch64,      ext: '' }
          - { os: macos-latest,   target: x86_64-apple-darwin,      suffix: macos-x86_64,       ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repo layout
        shell: bash
        run: test -f src/main.rs || { echo "src/main.rs is missing from the repo"; exit 1; }

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: sed -i.bak "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build installer
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/akkhara-installer${{ matrix.ext }}" "dist/Akkhara-Installer-${{ matrix.suffix }}"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
