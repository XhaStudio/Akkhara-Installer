# For the MAIN repo (XhaStudio/Akkhara-Programming-Language).
# Save as .github/workflows/release.yml there (or merge with your existing workflow).
# The installer downloads these exact asset names.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,  suffix: windows-x86_64.exe, ext: .exe }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, suffix: linux-x86_64,       ext: '' }
          - { os: macos-latest,   target: aarch64-apple-darwin,     suffix: macos-aarch64,      ext: '' }
          - { os: macos-latest,   target: x86_64-apple-darwin,      suffix: macos-x86_64,       ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/akk${{ matrix.ext }}" "dist/akk-${{ matrix.suffix }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
